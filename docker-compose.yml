version: "3.9"

services:
  db:
    image: postgres:16
    container_name: rblguard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rblguard}
      POSTGRES_USER: ${POSTGRES_USER:-rblguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rblguard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rblguard} -d ${POSTGRES_DB:-rblguard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: rblguard-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rblguard}:${POSTGRES_PASSWORD:-rblguard}@db:5432/${POSTGRES_DB:-rblguard}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      python scripts/seed_db.py &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"

  worker:
    build: .
    container_name: rblguard-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rblguard}:${POSTGRES_PASSWORD:-rblguard}@db:5432/${POSTGRES_DB:-rblguard}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    command: python -m worker.main

volumes:
  postgres_data:
